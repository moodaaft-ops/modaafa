<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Reem+Kufi:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Identity v1.0: flat navy, paper type, signal yellow as one small mark. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: 'IBM Plex Sans Arabic', sans-serif;
        background: #0E1426;
        color: #F4F2EC;
        position: relative;
        overflow: hidden;
      }
      .wrap {
        height: 100%;
        display: flex; flex-direction: column; justify-content: space-between;
        padding: 64px 80px;
      }
      .top { display: flex; align-items: center; justify-content: space-between; }
      .lockup { height: 92px; }
      .url {
        font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500;
        color: #9AA0AE; direction: ltr; letter-spacing: 0.04em;
      }
      h1 {
        font-family: 'Reem Kufi', 'IBM Plex Sans Arabic', sans-serif;
        font-size: 70px; line-height: 1.2; font-weight: 700;
      }
      .rule { width: 72px; height: 10px; background: #FBBC04; margin-top: 32px; }
      .sub { margin-top: 30px; font-size: 30px; color: #CDCFD4; font-weight: 500; }
      .foot {
        display: flex; align-items: center; justify-content: space-between;
        border-top: 1px solid #2A3144; padding-top: 24px;
        font-size: 24px; color: #9AA0AE; font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <img class="lockup" src="../public/brand/modaafa-lockup-reversed.svg" alt="" />
        <span class="url">ai.modaafa.com</span>
      </div>

      <div>
        <h1>الميديا باير الذكي لإعلانات Google</h1>
        <div class="rule"></div>
        <div class="sub" style="margin-top:24px">فحص للحساب وتوصيات مرتّبة، وموافقتك قبل أي تعديل.</div>
      </div>

      <div class="foot">
        <span>منصة عربية لإدارة حسابات Google Ads بالذكاء الاصطناعي</span>
        <span dir="ltr">Modaafa Ads AI</span>
      </div>
    </div>
  </body>
</html>
