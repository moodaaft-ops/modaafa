name: Production verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-verification
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify detailed launch health
        env:
          HEALTH_SECRET: ${{ secrets.HEALTH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$HEALTH_SECRET"

          response="$RUNNER_TEMP/health.json"
          status="$(curl --silent --show-error \
            --max-time 60 \
            -o "$response" \
            -w '%{http_code}' \
            -H "Authorization: Bearer $HEALTH_SECRET" \
            https://ai.modaafa.com/api/health)"
          test "$status" = "200"

          jq '{
            launch_ready,
            env_ok: ([.checks.env[]] | all),
            readiness_ok: .checks.readiness_summary.ok,
            database_ok: .checks.database.ok,
            billing_ok: .checks.billing.ok,
            ai_ok: .checks.ai.ok,
            operational_email_ok: .checks.operational_email.ok,
            operational_jobs_ok: .checks.database.operational_jobs.ok,
            job_capacity_ok: .checks.database.job_capacity.ok
          }' "$response"

          jq -e '.launch_ready == true' "$response" > /dev/null
