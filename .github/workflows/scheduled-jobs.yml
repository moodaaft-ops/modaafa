name: Scheduled production jobs

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-production
  cancel-in-progress: false

jobs:
  sync-google-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run hourly Google Ads sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ai.modaafa.com/api/cron/sync-google-ads

  optimize:
    needs: sync-google-ads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run hourly optimization analysis
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ai.modaafa.com/api/cron/optimize
