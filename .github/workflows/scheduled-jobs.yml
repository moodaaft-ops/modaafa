name: Scheduled production jobs

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
    - cron: '7,27 * * * *'
    - cron: '9 * * * *'
    # Morning guard: 05:30 Riyadh, plus a safety slot an hour later (GitHub drops scheduled triggers).
    - cron: '30 2 * * *'
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-production-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  sync-google-ads:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run hourly Google Ads sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ai.modaafa.com/api/cron/sync-google-ads

  optimize:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run hourly optimization analysis
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ai.modaafa.com/api/cron/optimize
      - name: Lead loop (offline conversion upload and tracking scan)
        # Harmless while LEAD_LOOP_ENABLED is off: the route answers 404 and does nothing.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          code=$(curl --silent --show-error --max-time 150 -o body.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ai.modaafa.com/api/cron/measurement)
          cat body.json; echo
          if [ "$code" = "200" ] || [ "$code" = "404" ] || [ "$code" = "409" ]; then exit 0; fi
          exit 1

  email-lifecycle:
    # Lifecycle emails (docs/email-lifecycle/CONTRACT.md). Harmless while the
    # feature is off: the route answers 503 {"skipped":"disabled"} and sends
    # nothing until EMAIL_LIFECYCLE_ENABLED=true, an activation time is set in
    # config/email-journeys.ts and each text is approved in lib/lifecycle/copy.ts.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7,27 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run email lifecycle (journeys, weekly report, broadcasts)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          code=$(curl --silent --show-error --max-time 150 -o body.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ai.modaafa.com/api/cron/email-lifecycle)
          cat body.json; echo
          if [ "$code" = "200" ] || [ "$code" = "409" ]; then exit 0; fi
          if [ "$code" = "503" ] && grep -q '"skipped":"disabled"' body.json; then exit 0; fi
          exit 1
      - name: Welcome email safety net
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ai.modaafa.com/api/cron/welcome-email

  provisioning:
    # «افتحه لي» (plan 121): follows the open invitations, marks the accepted and
    # the expired, and releases accepted accounts when PROVISIONING_UNLINK_AFTER_ACCEPT=true.
    # Harmless while the feature is not set up: the route answers 200 {"skipped":"not_configured"}.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Follow account invitations
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ai.modaafa.com/api/cron/provisioning

  guard:
    # الحارس الصباحي (lib/guard): rules-only daily check of every connected account.
    # Harmless while the feature is off: the route answers 200 {"skipped":"disabled"}.
    # The second slot only picks up accounts the first one missed (18 h recheck guard).
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * *' || github.event.schedule == '40 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run morning guard
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          code=$(curl --silent --show-error --retry 2 --retry-all-errors --max-time 290 -o body.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ai.modaafa.com/api/cron/guard)
          cat body.json; echo
          if [ "$code" = "200" ] || [ "$code" = "409" ]; then exit 0; fi
          exit 1
