name: Scheduled production jobs

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
    - cron: '7,27 * * * *'
    - cron: '9 * * * *'
    - cron: '31 5 1-3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-production-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  sync-google-ads:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run hourly Google Ads sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ai.modaafa.com/api/cron/sync-google-ads

  optimize:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run hourly optimization analysis
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ai.modaafa.com/api/cron/optimize

  email-lifecycle:
    # Lifecycle emails (docs/email-lifecycle/CONTRACT.md). Harmless while the
    # feature is off: the route answers 503 {"skipped":"disabled"} and sends
    # nothing until EMAIL_LIFECYCLE_ENABLED=true, an activation time is set in
    # config/email-journeys.ts and each text is approved in lib/lifecycle/copy.ts.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7,27 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run email lifecycle (journeys, weekly report, broadcasts)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          code=$(curl --silent --show-error --max-time 150 -o body.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ai.modaafa.com/api/cron/email-lifecycle)
          cat body.json; echo
          if [ "$code" = "200" ] || [ "$code" = "409" ]; then exit 0; fi
          if [ "$code" = "503" ] && grep -q '"skipped":"disabled"' body.json; then exit 0; fi
          exit 1
      - name: Welcome email safety net
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ai.modaafa.com/api/cron/welcome-email

  provisioning:
    # «افتحه لي» (plan 121): follows the open invitations, marks the accepted and
    # the expired, and releases accepted accounts when PROVISIONING_UNLINK_AFTER_ACCEPT=true.
    # Harmless while the feature is not set up: the route answers 200 {"skipped":"not_configured"}.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '9 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Follow account invitations
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ai.modaafa.com/api/cron/provisioning

  monthly-review:
    # Monthly deep session (MONTHLY_REVIEW_ENABLED). Scheduled only: the first three
    # days of the month at 05:31 UTC (08:31 Riyadh). Each account gets one report per
    # month, so the second and third slots only pick up what a missed slot left.
    # While the flag is off the route answers {"skipped":"disabled"} and does nothing.
    if: github.event.schedule == '31 5 1-3 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run monthly review
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 1 --retry-all-errors --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ai.modaafa.com/api/cron/monthly-review
